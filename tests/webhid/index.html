<!doctype html><meta charset="utf-8"><title>WebHID 验证</title>
<style>body{font:18px sans-serif;margin:32px}button{padding:14px 24px}pre{white-space:pre-wrap}</style>
<h1>WebHID 验证</h1><button id="choose">选择 HID 设备</button><pre id="result">准备检查浏览器 HID 接口…</pre>
<script>
window.hidTest = {supported:!!navigator.hid, stage:'ready'};
function show(){document.querySelector('#result').textContent=JSON.stringify(hidTest,null,2);}
async function scan(){try{hidTest.stage='enumerating';show();const d=await navigator.hid.getDevices();hidTest.granted=d.map(x=>({vendorId:x.vendorId,productId:x.productId,name:x.productName,collections:x.collections.map(c=>({usagePage:c.usagePage,usage:c.usage,input:c.inputReports.map(r=>r.reportId),output:c.outputReports.map(r=>r.reportId),feature:c.featureReports.map(r=>r.reportId)}))}));hidTest.stage='enumerated';}catch(e){hidTest.error=e.name+': '+e.message;}show();}
window.chooseDevice=async()=>{try{hidTest.stage='requesting';show();const devices=await navigator.hid.requestDevice({filters:[]});window.testDevice=devices[0];if(!testDevice){hidTest.stage='cancelled';show();return;}hidTest.selected={name:testDevice.productName,vendorId:testDevice.vendorId,productId:testDevice.productId,collections:testDevice.collections.map(c=>({usagePage:c.usagePage,usage:c.usage}))};await testDevice.open();hidTest.opened=testDevice.opened;hidTest.stage='opened';show();await readOnlyCheck();}catch(e){hidTest.error=e.name+': '+e.message;hidTest.stage='failed';}show();};
window.readOnlyCheck=async()=>{const d=window.testDevice;if(!d?.opened)return;try{const feature=d.collections.flatMap(c=>c.featureReports)[0];if(feature){const data=await d.receiveFeatureReport(feature.reportId);hidTest.featureRead={reportId:feature.reportId,bytes:data.byteLength};}if(d.collections.some(c=>c.usagePage===0xff60&&c.usage===0x61)){hidTest.protocolRead='pending';show();const reply=new Promise((resolve,reject)=>{const timer=setTimeout(()=>{d.removeEventListener('inputreport',onInput);reject(Error('Input report timeout'));},3000);function onInput(e){if(e.data.getUint8(0)!==1)return;clearTimeout(timer);d.removeEventListener('inputreport',onInput);resolve({reportId:e.reportId,bytes:e.data.byteLength,protocol:(e.data.getUint8(1)<<8)|e.data.getUint8(2)});}d.addEventListener('inputreport',onInput);});const query=new Uint8Array(32);query[0]=1;await d.sendReport(0,query);hidTest.protocolRead=await reply;}await d.close();hidTest.closed=!d.opened;hidTest.reopen=[];for(let n=0;n<3;n++){await d.open();const opened=d.opened;await d.close();hidTest.reopen.push(opened&&!d.opened);}hidTest.stage='complete';}catch(e){hidTest.error=e.name+': '+e.message;hidTest.stage='failed';if(d.opened)await d.close();}show();};
document.querySelector('#choose').onclick=chooseDevice;show();scan();
</script>
