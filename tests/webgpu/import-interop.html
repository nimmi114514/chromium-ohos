<!doctype html>
<meta charset="utf-8">
<title>WebGPU image and video interop verification</title>
<style>
body{font:18px sans-serif;background:#eee;color:#222;margin:20px}
canvas,video{width:240px;height:135px;margin:8px;border:1px solid #aaa}
pre{white-space:pre-wrap}
</style>
<h2>WebGPU image and video interop verification</h2>
<div id="sources"></div><pre id="status"></pre>
<script>
const check=(ok,message)=>{if(!ok)throw Error(message);};
const frame=()=>new Promise(requestAnimationFrame);
const near=(a,b,t=4)=>a.every((v,i)=>Math.abs(v-b[i])<=t);
let device,source,expected,presentation,context,presentationFormat;
let resources=[],errors=[],losses=[];
window.initialize=async()=>{
 const adapter=await navigator.gpu.requestAdapter();check(adapter,'No hardware adapter');
 check(!adapter.info.isFallbackAdapter,'Software adapter');device=await adapter.requestDevice();
 device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
 device.lost.then(e=>{if(e.reason!=='destroyed')losses.push(e.message);});
 return {vendor:adapter.info.vendor,architecture:adapter.info.architecture,preferredFormat:navigator.gpu.getPreferredCanvasFormat()};
};
function canvas(){const c=document.createElement('canvas');c.width=1024;c.height=512;sources.append(c);return c;}
window.prepare=async(name)=>{
 sources.replaceChildren();resources=[];source=null;expected=null;presentation=null;context=null;
 if(name.startsWith('present-')){
  presentation=canvas();presentationFormat=name.slice(8);context=presentation.getContext('webgpu');
  context.configure({device,format:presentationFormat,alphaMode:'opaque'});return;
 }
 if(name.startsWith('video-')){
  const v=document.createElement('video');v.muted=true;v.loop=true;v.playsInline=true;
  v.src='/'+(name==='video-avc'?'drdc-avc-1080p60.mp4':'drdc-hevc-1080p60.mp4');sources.append(v);
  await v.play();await new Promise(r=>v.requestVideoFrameCallback(r));v.pause();source=v;
  // Read the golden sample BEFORE tracing, not during the video import test.
  const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.drawImage(v,0,0,64,64);
  const bytes=x.getImageData(0,0,64,64).data;expected=[];
  for(let p=4;p<64;p+=8){const i=(32*64+p)*4;expected.push({x:p,pixel:[255-bytes[i],255-bytes[i+1],255-bytes[i+2],255]});}
  return {width:v.videoWidth,height:v.videoHeight};
 }
 const c=canvas();
 if(name==='webgl2'){
  const gl=c.getContext('webgl2',{alpha:false,preserveDrawingBuffer:true});check(gl,'No WebGL2');
  gl.clearColor(24/255,120/255,216/255,1);gl.clear(gl.COLOR_BUFFER_BIT);source=c;expected=[231,135,39,255];
 }else{
  const g=c.getContext('2d',{willReadFrequently:false});
  g.fillStyle=name==='canvas2d-alpha'?'rgba(200,80,40,.5)':'rgb(24,120,216)';g.fillRect(0,0,c.width,c.height);
  if(name!=='canvas2d-alpha')for(let i=0;i<120;i++)g.fillRect(i*7%1024,i*19%512,32,32);
  source=name==='imagebitmap'?await createImageBitmap(c):c;
  expected=name==='canvas2d-alpha'?[55,175,215,128]:[231,135,39,255];
 }
 await frame();await frame();
};
async function read(texture){
 const b=device.createBuffer({size:64*256,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
 const e=device.createCommandEncoder();e.copyTextureToBuffer({texture},{buffer:b,bytesPerRow:256},[64,64]);device.queue.submit([e.finish()]);
 await b.mapAsync(GPUMapMode.READ);const bytes=new Uint8Array(b.getMappedRange()).slice();b.unmap();b.destroy();return bytes;
}
window.runCase=async(name)=>{
 window.caseResult={done:false,passed:false,name};const result=caseResult;
 try{
  if(name.startsWith('present-')){
   result.frameTimings=[];
   for(const [width,height]of [[256,256],[1280,720],[1920,1080]]){
    presentation.width=width;presentation.height=height;
    const intervals=[];let previous;
    for(let i=0;i<30;i++){const time=await frame();if(i>=5)intervals.push(time-previous);previous=time;const e=device.createCommandEncoder(),p=e.beginRenderPass({colorAttachments:[{view:context.getCurrentTexture().createView(),clearValue:{r:.2,g:.6,b:.8,a:1},loadOp:'clear',storeOp:'store'}]});p.end();device.queue.submit([e.finish()]);}
    result.frameTimings.push({width,height,meanFrameMs:intervals.reduce((a,b)=>a+b,0)/intervals.length,samples:intervals});
   }
   await device.queue.onSubmittedWorkDone();
   // Drawing and snapshotting must stay in the same JS task. Waiting for the
   // queue can present/expire the canvas texture before drawImage sees it.
   const finalEncoder=device.createCommandEncoder(),finalPass=finalEncoder.beginRenderPass({colorAttachments:[{view:context.getCurrentTexture().createView(),clearValue:{r:.2,g:.6,b:.8,a:1},loadOp:'clear',storeOp:'store'}]});finalPass.end();device.queue.submit([finalEncoder.finish()]);
   performance.mark('interop-work-complete');
   // Verify presented pixels; this explicit CPU readback is outside the work interval.
   const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.drawImage(presentation,0,0,16,16);
   result.pixel=[...x.getImageData(8,8,1,1).data];check(near(result.pixel,[51,153,204,255]),'Presented pixel mismatch '+result.pixel);
  }else{
   const out=device.createTexture({size:[64,64],format:'rgba8unorm',usage:GPUTextureUsage.STORAGE_BINDING|GPUTextureUsage.COPY_SRC|GPUTextureUsage.RENDER_ATTACHMENT});resources.push(out);
   if(name.startsWith('video-')){
    const module=device.createShaderModule({code:`struct V{@builtin(position) p:vec4<f32>,@location(0) uv:vec2<f32>};
@vertex fn vs(@builtin(vertex_index)i:u32)->V{let p=array<vec2<f32>,3>(vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.));var v:V;v.p=vec4(p[i],0.,1.);v.uv=vec2((p[i].x+1.)*.5,1.-(p[i].y+1.)*.5);return v;}
@group(0)@binding(0)var image:texture_external;@group(0)@binding(1)var smp:sampler;
@fragment fn fs(v:V)->@location(0)vec4<f32>{let p=textureSampleBaseClampToEdge(image,smp,v.uv);return vec4(1.-p.rgb,1.);}`});
    const pipeline=await device.createRenderPipelineAsync({layout:'auto',vertex:{module,entryPoint:'vs'},fragment:{module,entryPoint:'fs',targets:[{format:'rgba8unorm'}]}});
    for(let i=0;i<8;i++){
     await frame();const external=device.importExternalTexture({source});
     const group=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:external},{binding:1,resource:device.createSampler({magFilter:'linear',minFilter:'linear'})}]});
     const e=device.createCommandEncoder(),p=e.beginRenderPass({colorAttachments:[{view:out.createView(),loadOp:'clear',storeOp:'store'}]});p.setPipeline(pipeline);p.setBindGroup(0,group);p.draw(3);p.end();device.queue.submit([e.finish()]);
    }
   }else{
    const input=device.createTexture({size:[64,64],format:'rgba8unorm',usage:GPUTextureUsage.COPY_DST|GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.RENDER_ATTACHMENT});resources.push(input);
    const module=device.createShaderModule({code:`@group(0)@binding(0)var image:texture_2d<f32>;@group(0)@binding(1)var outImage:texture_storage_2d<rgba8unorm,write>;
@compute @workgroup_size(8,8)fn main(@builtin(global_invocation_id)i:vec3<u32>){let p=textureLoad(image,vec2<i32>(i.xy),0);textureStore(outImage,vec2<i32>(i.xy),vec4(1.-p.rgb,p.a));}`});
    const pipeline=await device.createComputePipelineAsync({layout:'auto',compute:{module,entryPoint:'main'}});
    const group=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:input.createView()},{binding:1,resource:out.createView()}]});
    for(let i=0;i<8;i++){
     await frame();device.queue.copyExternalImageToTexture({source},{texture:input,premultipliedAlpha:false},[64,64]);
     const e=device.createCommandEncoder(),p=e.beginComputePass();p.setPipeline(pipeline);p.setBindGroup(0,group);p.dispatchWorkgroups(8,8);p.end();device.queue.submit([e.finish()]);
    }
   }
   await device.queue.onSubmittedWorkDone();performance.mark('interop-work-complete');
   const bytes=await read(out);result.samples=[];
   for(const s of name.startsWith('video-')?expected:[{x:32,pixel:expected}]){
    const i=(32*64+s.x)*4,pixel=[...bytes.slice(i,i+4)];result.samples.push({actual:pixel,expected:s.pixel});check(near(pixel,s.pixel,name.startsWith('video-')?10:5),'Processed pixel mismatch '+pixel+' expected '+s.pixel);
   }
  }
  check(!errors.length,errors.join(';'));check(!losses.length,losses.join(';'));result.passed=true;
 }catch(e){result.error=String(e);}finally{result.done=true;result.errors=[...errors];result.losses=[...losses];document.querySelector('#status').textContent=JSON.stringify(result,null,2);}
 return result;
};
window.finishCase=()=>{context?.unconfigure();for(const r of resources)r.destroy();if(source instanceof ImageBitmap)source.close();if(source instanceof HTMLVideoElement){source.pause();source.removeAttribute('src');source.load();}sources.replaceChildren();};
window.benchmarkImports=async(kind)=>{
 window.benchmarkResult={done:false,passed:false,kind,width:1920,height:1080,samples:[]};const result=benchmarkResult;
 try{
  sources.replaceChildren();const c=canvas();c.width=1920;c.height=1080;
  const video=kind.startsWith('video-');let videoPipeline;
  if(video){
   await prepare(kind);await source.play();
   const module=device.createShaderModule({code:`struct V{@builtin(position)p:vec4<f32>,@location(0)uv:vec2<f32>};@vertex fn vs(@builtin(vertex_index)i:u32)->V{let p=array<vec2<f32>,3>(vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.));var v:V;v.p=vec4(p[i],0.,1.);v.uv=vec2((p[i].x+1.)*.5,1.-(p[i].y+1.)*.5);return v;}@group(0)@binding(0)var image:texture_external;@group(0)@binding(1)var smp:sampler;@fragment fn fs(v:V)->@location(0)vec4<f32>{let p=textureSampleBaseClampToEdge(image,smp,v.uv);return vec4(1.-p.rgb,1.);}`});
   videoPipeline=await device.createRenderPipelineAsync({layout:'auto',vertex:{module,entryPoint:'vs'},fragment:{module,entryPoint:'fs',targets:[{format:'rgba8unorm'}]}});
  }
  const gl=kind==='webgl2'?c.getContext('webgl2',{alpha:false,preserveDrawingBuffer:true}):null;
  const g=gl?null:c.getContext('2d',{willReadFrequently:false,alpha:false});
  const dst=device.createTexture({size:[c.width,c.height],format:'rgba8unorm',usage:GPUTextureUsage.COPY_DST|GPUTextureUsage.COPY_SRC|GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.RENDER_ATTACHMENT});resources.push(dst);
  await frame();await frame();
  for(let i=0;i<98;i++){
   check(document.visibilityState==='visible','Benchmark became hidden');
   if(video)await new Promise(r=>source.requestVideoFrameCallback(r));
   const start=performance.now(),r=(i%2?40:80)/255;
   if(video){
    const group=device.createBindGroup({layout:videoPipeline.getBindGroupLayout(0),entries:[{binding:0,resource:device.importExternalTexture({source})},{binding:1,resource:device.createSampler({magFilter:'linear',minFilter:'linear'})}]});
    const e=device.createCommandEncoder(),p=e.beginRenderPass({colorAttachments:[{view:dst.createView(),loadOp:'clear',storeOp:'store'}]});p.setPipeline(videoPipeline);p.setBindGroup(0,group);p.draw(3);p.end();device.queue.submit([e.finish()]);
   }else{
    if(gl){gl.clearColor(r,120/255,216/255,1);gl.clear(gl.COLOR_BUFFER_BIT);}else{g.fillStyle='rgb('+Math.round(r*255)+',120,216)';g.fillRect(0,0,c.width,c.height);}
    device.queue.copyExternalImageToTexture({source:c},{texture:dst,premultipliedAlpha:false},[c.width,c.height]);
   }
   await device.queue.onSubmittedWorkDone();if(i>=8)result.samples.push(performance.now()-start);
  }
  const samples=[...result.samples].sort((a,b)=>a-b);result.meanMs=result.samples.reduce((a,b)=>a+b,0)/samples.length;result.medianMs=samples[Math.floor(samples.length/2)];result.p95Ms=samples[Math.floor(samples.length*.95)];
  check(!errors.length,errors.join(';'));check(!losses.length,losses.join(';'));result.passed=true;
 }catch(e){result.error=String(e);}finally{result.done=true;document.querySelector('#status').textContent=JSON.stringify(result,null,2);}
 return result;
};
window.finish=()=>{finishCase();device?.destroy();};
</script>
